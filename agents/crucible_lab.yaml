          properties:
            entry_id: {type: string}
            entry_type: {type: string, enum: [evidence, hypothesis, critique, experiment_design, preregistration, decision, prediction]}
            agent: {type: string}
            label: {type: string, enum: [FACT, EVIDENCE, INFERENCE, HYPOTHESIS, RESULT, UNCERTAINTY]}
            text: {type: string}
            citations: {type: array, items: {type: string}}
            parents: {type: array, items: {type: string}}
            confidence: {type: number}
            payload_json: {type: string}
          required: [entry_id, entry_type, agent, label, text]

  designer_agent:
    type: agent
    policies:
      audit_log:
        type: function
        handler: crucible.policies.governance.make_audit_log_policy
        factory_params:
          log_path: logs/tool_audit.jsonl
      kill_switch:
        type: function
        handler: crucible.policies.governance.make_kill_switch_policy
        factory_params:
          stop_file: STOP
      least_privilege:
        type: function
        handler: crucible.policies.least_privilege.make_least_privilege_policy
        factory_params:
          blocked_prefixes:
            - mcp__claude_ai_
      blinding:
        type: function
        handler: crucible.policies.blinding.make_blinding_policy
        factory_params:
          ledger_path: ledger/ledger.jsonl
          gated_tools:
            - query_oracle
            - run_campaign
      call_cap:
        type: function
        handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
        factory_params:
          limit: 300
    description: Designs at least two experiments, scores them, and writes the preregistration.
    prompt: |
      You are the Experiment Designer of CRUCIBLE. You own one decision: which experiment the lab
      commits its budget to. Call read_ledger and pool_summary. The protocol (initial labels, budget,
      batch size, seeds, top fraction) is fixed and identical for every arm. You choose only:
      feature_set, acquisition, kappa, diversity.
      1. Write two entries: entry_type "experiment_design", label "INFERENCE", agent "Designer", ids
         d-001 and d-002, each with payload_json {"spec": {...}, "scores": {"expected_information_gain":
         1-5, "scientific_relevance": 1-5, "feasibility": 1-5, "cost": 1-5, "reproducibility": 1-5,
         "risk": 1-5}, "rationale": "...", "tests_hypotheses": [...]}, parents = the hypotheses and
         critiques it addresses.
      2. Choose one and write: entry_type "preregistration", id prereg-001, label "INFERENCE", agent
         "Designer", parents [chosen design id and the hypothesis ids], payload_json {"spec": {...},
         "chosen_design": "...", "rejected_design": "...", "why": "...", "primary_metric": "Mean paired
         difference in final top-5% recall, C_crucible minus B_baseline_ei, across seeds, with 95%
         bootstrap CI", "secondary_metrics": ["C vs A_random", "B_baseline_ei vs
         B_ablation_composition_only", "median oracle calls to 50% recall"], "success_criterion": "...",
         "decision_rules": [{"if": "...", "then": "..."}]}.
      Decision rules must cover: C better than B (CI excludes 0), C equivalent to B, C worse than B,
      and the structure-vs-composition outcome. You will not see any result before this is approved and run.
      IDS AND LOOPS (overrides the fixed ids above): call read_ledger and use the next free ids
      (for example d-003, d-004 and prereg-002 if earlier ones exist). If you are asked to act on a
      prior decision entry, the new preregistration must list that decision in parents and state,
      issue by issue, how the design addresses it.
      PROTOCOL OVERRIDES: you may set "protocol_overrides" in the preregistration payload, within the
      protocol_override_limits reported by pool_summary (budget, n_seeds, seed_offset). Every arm uses
      the same protocol. Use fresh seeds (seed_offset 100 or 200) for any replication. Derive the
      practical margin from the headroom the baseline is expected to have at the chosen budget, using
      only numbers already recorded in the ledger or returned by get_results, and say how you derived
      it. Prefer keeping the previous candidate spec unless a decision gives a reason to change it, so
      the replication isolates the effect of the protocol change.
      HUMAN RESEARCH FOCUS: if your task message includes a human research focus, quote it verbatim
      in the preregistration payload as "human_focus", and explain in "why" how the design addresses
      it, or why it cannot be fully addressed with the lab's fixed question, dataset, tools and
      protocol limits. If no focus was given, omit "human_focus".
