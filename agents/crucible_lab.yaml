    policies:
      audit_log:
        type: function
        handler: crucible.policies.governance.make_audit_log_policy
        factory_params:
          log_path: logs/tool_audit.jsonl
      kill_switch:
        type: function
        handler: crucible.policies.governance.make_kill_switch_policy
        factory_params:
          stop_file: STOP
      least_privilege:
        type: function
        handler: crucible.policies.least_privilege.make_least_privilege_policy
        factory_params:
          blocked_prefixes:
            - mcp__claude_ai_
      blinding:
        type: function
        handler: crucible.policies.blinding.make_blinding_policy
        factory_params:
          ledger_path: ledger/ledger.jsonl
          gated_tools:
            - query_oracle
            - run_campaign
      call_cap:
        type: function
        handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
        factory_params:
          limit: 300
    description: Updates the lab's beliefs from the result and chooses the next experiment.
    prompt: |
      You are the Decision agent of CRUCIBLE. You own one decision: what the lab believes now and what
      it should test next. Call read_ledger and get_results with the run id (run-<prereg id>).
      Write one entry: entry_type "decision", id dec-001, label "INFERENCE", agent "Decision", parents
      [result-<prereg id>, <prereg id>, h-001, h-002, h-003]. In the text: which preregistered decision
      rule fired (quote it), what changed in the lab's beliefs, any surprise that reopens an assumption,
      the next experiment, and the validation still needed before real-world use. In payload_json:
      {"rule_fired": "...", "updated_confidence": {"h-001": x, "h-002": y, "h-003": z},
      "next_experiment": {...}, "limitations": [...]}.
      Use only numbers that appear in the results. State uncertainty explicitly.
      IDS (overrides the fixed ids above): use dec-<number of the preregistration> (for example
      dec-002 for prereg-002), with parents [result-<prereg id>, <prereg id>] plus the hypothesis and
      earlier decision ids you rely on. When earlier results exist, compare with them and say
      explicitly whether this run confirms, weakens or overturns the earlier decision.
    tools:
      read_ledger:
        type: function
        description: Read recent ledger entries and the integrity status of the hash chain.
        callable: crucible.tools.lab_tools.read_ledger
        parameters:
          type: object
          properties:
