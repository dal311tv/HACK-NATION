            entry_type: {type: string, enum: [evidence, hypothesis, critique, experiment_design, preregistration, decision, prediction]}
            agent: {type: string}
            label: {type: string, enum: [FACT, EVIDENCE, INFERENCE, HYPOTHESIS, RESULT, UNCERTAINTY]}
            text: {type: string}
            citations: {type: array, items: {type: string}}
            parents: {type: array, items: {type: string}}
            confidence: {type: number}
            payload_json: {type: string}
          required: [entry_id, entry_type, agent, label, text]

  hypothesis_agent:
    type: agent
    policies:
      audit_log:
        type: function
        handler: crucible.policies.governance.make_audit_log_policy
        factory_params:
          log_path: logs/tool_audit.jsonl
      kill_switch:
        type: function
        handler: crucible.policies.governance.make_kill_switch_policy
        factory_params:
          stop_file: STOP
      least_privilege:
        type: function
        handler: crucible.policies.least_privilege.make_least_privilege_policy
        factory_params:
          blocked_prefixes:
            - mcp__claude_ai_
      blinding:
        type: function
        handler: crucible.policies.blinding.make_blinding_policy
        factory_params:
          ledger_path: ledger/ledger.jsonl
          gated_tools:
            - query_oracle
            - run_campaign
      call_cap:
        type: function
        handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
        factory_params:
          limit: 300
    description: Generates competing, testable hypotheses linked to evidence.
    prompt: |
      You are the Hypothesis agent of CRUCIBLE. You own one decision: which competing, testable
      hypotheses the lab holds. Call read_ledger and pool_summary first.
      Write exactly 3 entries: entry_type "hypothesis", label "HYPOTHESIS", agent "Hypothesis",
      ids h-001, h-002, h-003:
      - one about descriptor families (composition only vs composition + structure),
      - one about acquisition strategy (uncertainty-aware or diversity-aware vs standard expected improvement),
      - one competing or null hypothesis that would make the agent-designed strategy unnecessary.
      Each states the claim, the observable it predicts in this protocol (top-5% recall at the fixed
      budget, or oracle calls to 50% recall), a prior confidence 0-1 in the confidence field, and
      parents = the evidence ids it relies on. These are agent-generated and never facts.
    tools:
      read_ledger:
        type: function
        description: Read recent ledger entries and the integrity status of the hash chain.
        callable: crucible.tools.lab_tools.read_ledger
        parameters:
          type: object
          properties:
            last_n: {type: integer}
      pool_summary:
        type: function
        description: Describe the candidate pool and the allowed experiment settings. Never reveals target values.
        callable: crucible.tools.lab_tools.pool_summary
        parameters:
          type: object
          properties: {}
      write_ledger_entry:
