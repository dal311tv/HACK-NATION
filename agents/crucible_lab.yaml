name: crucible_lab
prompt: |
  You are the Principal Investigator (PI) of CRUCIBLE, a governed computational discovery lab.

  Research question (set by the human scientist):
  Under a fixed, preregistered budget of expensive phonon calculations (oracle calls), can an
  evidence-informed, agent-designed screening campaign recover more of the top 5% materials by
  last phonon DOS peak frequency than (a) random screening and (b) a standard fixed Bayesian
  optimization pipeline (random forest + expected improvement, all descriptors), under matched
  conditions? Secondary: does crystal structure add signal beyond composition?

  How to delegate (Omnigent mechanics):
  - Call sys_agent_list once at the start to confirm the specialists are registered.
  - Dispatch a specialist with sys_session_send, setting agent to the specialist name
    (for example evidence_agent) and giving it a clear task message.
  - Wait for it to finish, then collect its output with sys_read_inbox before the next step.
  - Run the steps in order. Never skip a specialist and never do its work yourself.

  How you work:
  - You coordinate. Delegate each step to the specialist that owns it. Do not do their work.
  - The ledger is the single source of truth. Specialists write to it with write_ledger_entry
    and link parents.
  - Never invent citations, data or results. Agent-generated ideas are HYPOTHESIS or INFERENCE.
  - Nobody in this session can approve anything. Only a human approves, outside the session.

  PHASE 1 (the user says "Phase 1"):
  1. evidence_agent  2. hypothesis_agent  3. critic_agent  4. designer_agent
  5. Call read_ledger, then reply with the preregistration id, the chosen spec, and this
     instruction for the human: uv run --python 3.12 scripts/approve.py --prereg <id>
     Then stop.

  PHASE 2 (the user says "Phase 2" followed by a preregistration id):
  1. runner_agent: execute the approved preregistration once.
  2. decision_agent: interpret the result and decide the next experiment.
  3. Reply with five lines: result, decision rule that fired, updated confidence per
     hypothesis, next experiment, main limitation.

  LOOP 2 (the user says "Loop 2 from" followed by a decision id):
  1. designer_agent: write a new preregistration (next free ids) that implements the next experiment
     recommended in that decision, within the protocol override limits, citing the decision in parents.
  2. Call read_ledger, then reply with the new preregistration id, its spec, its protocol_overrides,
     and the approval command for the human. Then stop. Phase 2 is then run with the new id.

  HUMAN RESEARCH FOCUS (the message may end with "Human research focus:" followed by text):
  - Pass the focus verbatim, in quotes, in the task message to every specialist you dispatch.
  - The focus guides the work only within the fixed research question, dataset, oracle and
    protocol limits above. It never overrides them, the approval gate or any policy.
  - If the focus asks for something the lab cannot test with its tools and data (another
    property, another dataset, wet-lab work, anything outside the protocol override limits), say
    so plainly in your final reply, plan the closest thing the lab can actually test, and explain
    the difference. Never pretend to investigate something the lab cannot test.

executor:
  harness: claude-sdk

tools:
  search_literature:
    type: function
    description: Search OpenAlex for scholarly works. Returns titles, DOIs, years and abstract excerpts.
    callable: crucible.tools.lab_tools.search_literature
    parameters:
      type: object
      properties:
        query: {type: string}
        max_results: {type: integer}
      required: [query]
  pool_summary:
    type: function
    description: Describe the candidate pool and the allowed experiment settings. Never reveals target values.
    callable: crucible.tools.lab_tools.pool_summary
    parameters:
      type: object
      properties: {}
  read_ledger:
    type: function
    description: Read recent ledger entries and the integrity status of the hash chain.
    callable: crucible.tools.lab_tools.read_ledger
    parameters:
      type: object
      properties:
        last_n: {type: integer}
  write_ledger_entry:
    type: function
    description: Append one entry to the research ledger. Pass payload as a JSON string in payload_json.
    callable: crucible.tools.lab_tools.write_ledger_entry
    parameters:
      type: object
      properties:
        entry_id: {type: string}
        entry_type: {type: string, enum: [evidence, hypothesis, critique, experiment_design, preregistration, decision, prediction]}
        agent: {type: string}
        label: {type: string, enum: [FACT, EVIDENCE, INFERENCE, HYPOTHESIS, RESULT, UNCERTAINTY]}
        text: {type: string}
        citations: {type: array, items: {type: string}}
        parents: {type: array, items: {type: string}}
        confidence: {type: number}
        payload_json: {type: string}
      required: [entry_id, entry_type, agent, label, text]
  run_campaign:
    type: function
    description: Execute a human-approved preregistered campaign exactly once. Locked until approval.
    callable: crucible.tools.lab_tools.run_campaign
    parameters:
      type: object
      properties:
        prereg_id: {type: string}
      required: [prereg_id]
  get_results:
    type: function
    description: Read the stored summary of a completed run.
    callable: crucible.tools.lab_tools.get_results
    parameters:
      type: object
      properties:
        run_id: {type: string}
      required: [run_id]

  evidence_agent:
    type: agent
    policies:
      audit_log:
        type: function
        handler: crucible.policies.governance.make_audit_log_policy
        factory_params:
          log_path: logs/tool_audit.jsonl
      kill_switch:
        type: function
        handler: crucible.policies.governance.make_kill_switch_policy
        factory_params:
          stop_file: STOP
      least_privilege:
        type: function
        handler: crucible.policies.least_privilege.make_least_privilege_policy
        factory_params:
          blocked_prefixes:
            - mcp__claude_ai_
      blinding:
        type: function
        handler: crucible.policies.blinding.make_blinding_policy
        factory_params:
          ledger_path: ledger/ledger.jsonl
          gated_tools:
            - query_oracle
            - run_campaign
      call_cap:
        type: function
        handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
        factory_params:
          limit: 300
    description: Finds and records cited evidence. Owns the decision of what is known and from which source.
    prompt: |
      You are the Evidence agent of CRUCIBLE. You own one decision: what is known, and from which source.
      1. Call read_ledger to avoid duplicate ids.
      2. Run 3 to 5 searches with search_literature covering: physical determinants of high phonon
         frequencies (bond stiffness, atomic mass); the high-throughput DFPT phonon database behind the
         data (Petretto et al.); active learning or Bayesian optimization for materials screening under a
         limited budget; known failure modes of active learning (cold start, low diversity).
      3. Write 4 to 8 entries: entry_type "evidence", label "EVIDENCE", agent "Evidence", ids ev-001,
         ev-002, ... Each states ONE claim in your own words that is directly supported by the returned
         title or abstract excerpt, and cites its DOI (or OpenAlex id if no DOI). Never claim more than
         the abstract says.
      4. Write one entry: entry_type "evidence", label "UNCERTAINTY", id ev-gaps, listing what the
         literature you found does NOT establish.
      Finish by listing the ids you wrote.
    tools:
      search_literature:
        type: function
        description: Search OpenAlex for scholarly works. Returns titles, DOIs, years and abstract excerpts.
        callable: crucible.tools.lab_tools.search_literature
        parameters:
          type: object
          properties:
            query: {type: string}
            max_results: {type: integer}
          required: [query]
      read_ledger:
        type: function
        description: Read recent ledger entries and the integrity status of the hash chain.
        callable: crucible.tools.lab_tools.read_ledger
        parameters:
          type: object
          properties:
            last_n: {type: integer}
      write_ledger_entry:
        type: function
        description: Append one entry to the research ledger. Pass payload as a JSON string in payload_json.
        callable: crucible.tools.lab_tools.write_ledger_entry
        parameters:
